# HOPE runtime configuration -- clean 105-D Unitree G1 reference deploy.
#
# Read by the clean-room reference runner (g1_deploy_onnx_ref_pingpong). Every
# relative path resolves against THIS file's directory.
#
# Single observation/action path only: 105-D observation, 29-D action, no
# observation normalization, one control rate. There are no model/experiment
# codenames, playback, or admission-control settings here.

contract: hope_pingpong_g1
control_hz: 50.0                 # 50 Hz control loop
observation_normalization: none  # raw observation (must stay 'none')
passive_neck: false              # the G1 has no neck (no held columns)

policy:
  # Place your exported actor here (obs[1,105] -> raw_action[1,29]).
  # Override on the command line with --onnx.
  onnx_path: ../models/hope_pingpong_g1.onnx
  joint_order: unitree_g1        # informational; the canonical order lives in joint_order.py

action_adapter:
  # The shared adapter config (also read by the training package).
  config_path: action_adapter.yaml

simulation:
  # TODO: a G1 ping-pong MJCF (with a racket collision geom + racket site + a pelvis free-joint and
  # gyro sensor for sim_bridge.py) is NOT shipped yet — the MuJoCo real-ball path is the deferred
  # follow-up. Point --model-xml at your G1 MJCF (e.g. adapted from
  # TTRL-ICRA2026/Beyondmimic_Deploy_G1/mjmodel.xml) to run the in-process sim.
  model_xml_path: ../models/g1_pingpong.xml
  # Simulation PD gains for the MuJoCo bridge. These MATCH the Isaac training actuator
  # stiffness/damping (robots/g1.py: 7520/5020/4010 motor models) so the deployed policy
  # sees the same joint dynamics it trained under. A flat kp=200 (the old placeholder) is
  # 2-7x too stiff and makes the robot over-torque and topple during the swing.
  # Group values are the default for each group; per_joint overrides the members whose
  # Isaac gain differs within the group (ankle/knee/hip_roll, waist_roll/pitch, wrist_pitch/yaw).
  # NOTE: no 'neck' group (the G1 has no head).
  pd_gains:
    groups:
      waist: {kp: 40.18, kd: 2.56}   # waist_yaw (7520_14); waist_roll/pitch overridden below
      arm:   {kp: 14.25, kd: 0.91}   # shoulder/elbow/wrist_roll (5020); wrist_pitch/yaw overridden
      leg:   {kp: 40.18, kd: 2.56}   # hip_pitch/hip_yaw (7520_14); hip_roll/knee/ankle overridden
    per_joint:
      # legs: hip_roll + knee are 7520_22 (stiffer); ankles are dual-5020 (soft, critical for balance)
      left_hip_roll_joint:   {kp: 99.10, kd: 6.31}
      right_hip_roll_joint:  {kp: 99.10, kd: 6.31}
      left_knee_joint:       {kp: 99.10, kd: 6.31}
      right_knee_joint:      {kp: 99.10, kd: 6.31}
      left_ankle_pitch_joint:  {kp: 28.50, kd: 1.81}
      right_ankle_pitch_joint: {kp: 28.50, kd: 1.81}
      left_ankle_roll_joint:   {kp: 28.50, kd: 1.81}
      right_ankle_roll_joint:  {kp: 28.50, kd: 1.81}
      # waist roll/pitch are dual-5020
      waist_roll_joint:  {kp: 28.50, kd: 1.81}
      waist_pitch_joint: {kp: 28.50, kd: 1.81}
      # wrists pitch/yaw are 4010
      left_wrist_pitch_joint:  {kp: 16.78, kd: 1.07}
      right_wrist_pitch_joint: {kp: 16.78, kd: 1.07}
      left_wrist_yaw_joint:    {kp: 16.78, kd: 1.07}
      right_wrist_yaw_joint:   {kp: 16.78, kd: 1.07}

lifecycle:
  # Example continuous-rally timing (ready -> swing -> follow-through -> recovery).
  follow_through_s: 0.6
  recovery_s: 0.8
  ready_time_to_strike: 1.0
  # Base-relative ready reach the racket goal holds while idle (example values).
  ready_reach_x: 0.40
  ready_reach_y: 0.20
  ready_reach_z: -0.05
